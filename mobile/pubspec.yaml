name: coach_hq
description: "Coach HQ trainee app: log workouts, check in and message your coach."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  cupertino_icons: ^2.0.0
  cupertino_ui: ^1.1.6
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.1.0
  path_drawing: ^1.0.1
  path_provider: ^2.1.6
  video_player: ^2.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Xcode 16.1 (Swift 6.0) can't compile video_player_avfoundation 2.12.1+ (it uses
# Swift 6.1 syntax). Remove this once Xcode is updated.
dependency_overrides:
  video_player_avfoundation: 2.12.0
